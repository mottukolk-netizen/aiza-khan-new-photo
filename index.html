    .ad-slot {

      margin: 12px 0;
      padding: 10px;
      border-radius: 12px;
      background: #0d0f14;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .see-more {
      display: block;
      width: 90%;
