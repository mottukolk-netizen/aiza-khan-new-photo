    .photo-card {

      margin-bottom: 28px;

      margin-top: 14px;

      background: #0d0f14;
      border-radius: 12px;

      margin: 35px auto;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #d4af62, #9d7430);
      color: #08090d;
      font-size: 17px;
      font-weight: bold;

    #more-message {

    footer {
