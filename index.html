<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aiza Khan New Photos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: #111318;
      border-bottom: 1px solid #c9a35d;
    }

    h1 {
      margin: 0;
      color: #d4af62;
      font-size: 30px;
    }

    header p {
      color: #aaa;
      margin: 8px 0 0;
    }

    .gallery {
      max-width: 700px;
      margin: auto;
      padding: 20px 12px;
    }

    .photo-card {
      background: #111318;
      border: 1px solid #292b32;
      border-radius: 18px;
      padding: 10px;
      margin-bottom: 28px;
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 13px;
    }

    .see-more {
      display: block;
      width: 90%;
      max-width: 350px;
      margin: 35px auto;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: #d4af62;
      color: #08090d;
      font-size: 17px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>

  <header>
    <h1>Aiza Khan</h1>
    <p>Latest & Beautiful Photo Gallery</p>
  </header>

  <main class="gallery">

    <div class="photo-card">
      <img src="Photo1.png" alt="Aiza Khan Photo 1">
    </div>

    <div class="photo-card">
      <img src="Photo2.png" alt="Aiza Khan Photo 2">
    </div>

    <div class="photo-card">
      <img src="Photo3.png" alt="Aiza Khan Photo 3">
    </div>

    <div class="photo-card">
      <img src="Photo4.png" alt="Aiza Khan Photo 4">
    </div>

    <div class="photo-card">
      <img src="Photo5.png" alt="Aiza Khan Photo 5">
    </div>

    <div class="photo-card">
      <img src="Photo6.png" alt="Aiza Khan Photo 6">
    </div>

    <div class="photo-card">
      <img src="Photo7.png" alt="Aiza Khan Photo 7">
    </div>

    <div class="photo-card">
      <img src="Photo8.png" alt="Aiza Khan Photo 8">
    </div>

    <div class="photo-card">
      <img src="Photo9.png" alt="Aiza Khan Photo 9">
    </div>

    <div class="photo-card">
      <img src="Photo10.png" alt="Aiza Khan Photo 10">
    </div>

    <button class="see-more" onclick="showMorePhotos()">
      See More Photos
    </button>

    <p id="more-message" style="text-align:center;color:#aaa;"></p>

  </main>

  <footer>
    © 2026 Aiza Khan Photo Gallery
  </footer>

  <script>
    function showMorePhotos() {
      document.getElementById("more-message").textContent =
        "More photos will be added soon.";
    }
  </script>

</body>
</html>
